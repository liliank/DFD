
<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
  <defs>
    <style>
      .title { font: bold 24px sans-serif; fill: #2c3e50; }
      .process { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .external { fill: #ecf0f1; stroke: #34495e; stroke-width: 2; }
      .datastore { fill: none; stroke: #e67e22; stroke-width: 2; }
      .text { font: 13px sans-serif; fill: #2c3e50; text-anchor: middle; }
      .label { font: bold 14px sans-serif; fill: white; text-anchor: middle; }
      .process-num { font: bold 12px sans-serif; fill: white; }
      .flow-label { font: 11px sans-serif; fill: #34495e; }
      .arrow { fill: none; stroke: #2c3e50; stroke-width: 2; marker-end: url(#arrowhead); }
      .bi-arrow { fill: none; stroke: #2c3e50; stroke-width: 2; marker-end: url(#arrowhead); marker-start: url(#arrowhead-start); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2c3e50" />
    </marker>
    <marker id="arrowhead-start" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto">
      <polygon points="10 0, 0 3, 10 6" fill="#2c3e50" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="700" y="40" class="title">Level 1: Account Service - Main Processes</text>

  <!-- External Entities -->
  <!-- User -->
  <rect x="50" y="200" width="100" height="70" class="external"/>
  <text x="100" y="240" class="text">User/Client</text>

  <!-- Admin -->
  <rect x="50" y="750" width="100" height="70" class="external"/>
  <text x="100" y="790" class="text">Administrator</text>

  <!-- Email System -->
  <rect x="1250" y="200" width="100" height="70" class="external"/>
  <text x="1300" y="240" class="text">Email System</text>

  <!-- Auth Provider -->
  <rect x="1250" y="750" width="100" height="70" class="external"/>
  <text x="1300" y="775" class="text">Auth Provider</text>
  <text x="1300" y="795" class="text">(SSO/OAuth)</text>

  <!-- Data Stores -->
  <!-- D1: User Accounts -->
  <g transform="translate(600, 880)">
    <path d="M 0 0 L 200 0" class="datastore"/>
    <path d="M 0 30 L 200 30" class="datastore"/>
    <path d="M 0 0 L 0 30" class="datastore"/>
    <path d="M 200 0 L 200 30" class="datastore"/>
    <text x="100" y="20" class="text">D1: User Accounts</text>
  </g>

  <!-- D2: Session Store -->
  <g transform="translate(250, 550)">
    <path d="M 0 0 L 150 0" class="datastore"/>
    <path d="M 0 30 L 150 30" class="datastore"/>
    <path d="M 0 0 L 0 30" class="datastore"/>
    <path d="M 150 0 L 150 30" class="datastore"/>
    <text x="75" y="20" class="text">D2: Sessions</text>
  </g>

  <!-- D3: Audit Log -->
  <g transform="translate(1000, 550)">
    <path d="M 0 0 L 150 0" class="datastore"/>
    <path d="M 0 30 L 150 30" class="datastore"/>
    <path d="M 0 0 L 0 30" class="datastore"/>
    <path d="M 150 0 L 150 30" class="datastore"/>
    <text x="75" y="20" class="text">D3: Audit Log</text>
  </g>

  <!-- Main Processes -->
  <!-- P1: User Registration -->
  <circle cx="300" cy="150" r="60" class="process"/>
  <text x="300" y="140" class="process-num">1.0</text>
  <text x="300" y="158" class="label">User</text>
  <text x="300" y="173" class="label">Registration</text>

  <!-- P2: Authentication -->
  <circle cx="550" cy="235" r="60" class="process"/>
  <text x="550" y="225" class="process-num">2.0</text>
  <text x="550" y="243" class="label">Authentication</text>

  <!-- P3: Session Management -->
  <circle cx="300" cy="430" r="60" class="process"/>
  <text x="300" y="420" class="process-num">3.0</text>
  <text x="300" y="438" class="label">Session</text>
  <text x="300" y="453" class="label">Management</text>

  <!-- P4: Profile Management -->
  <circle cx="700" cy="430" r="60" class="process"/>
  <text x="700" y="420" class="process-num">4.0</text>
  <text x="700" y="438" class="label">Profile</text>
  <text x="700" y="453" class="label">Management</text>

  <!-- P5: Password Management -->
  <circle cx="950" cy="235" r="60" class="process"/>
  <text x="950" y="225" class="process-num">5.0</text>
  <text x="950" y="243" class="label">Password</text>
  <text x="950" y="258" class="label">Management</text>

  <!-- P6: Authorization -->
  <circle cx="550" cy="650" r="60" class="process"/>
  <text x="550" y="640" class="process-num">6.0</text>
  <text x="550" y="658" class="label">Authorization</text>

  <!-- P7: User Admin -->
  <circle cx="300" cy="785" r="60" class="process"/>
  <text x="300" y="775" class="process-num">7.0</text>
  <text x="300" y="793" class="label">User</text>
  <text x="300" y="808" class="label">Administration</text>

  <!-- P8: Audit/Logging -->
  <circle cx="950" cy="430" r="60" class="process"/>
  <text x="950" y="420" class="process-num">8.0</text>
  <text x="950" y="438" class="label">Audit &amp;</text>
  <text x="950" y="453" class="label">Logging</text>

  <!-- Data Flows -->
  <!-- User to P1 Registration -->
  <path d="M 150 215 L 255 175" class="arrow"/>
  <text x="180" y="190" class="flow-label">Registration Info</text>

  <path d="M 250 165 L 150 205" class="arrow"/>
  <text x="180" y="175" class="flow-label">Confirmation</text>

  <!-- User to P2 Authentication -->
  <path d="M 150 235 L 490 235" class="arrow"/>
  <text x="280" y="228" class="flow-label">Credentials</text>

  <path d="M 485 245 L 150 245" class="arrow"/>
  <text x="280" y="260" class="flow-label">Auth Token</text>

  <!-- P1 to Email System -->
  <path d="M 360 150 L 1250 220" class="arrow"/>
  <text x="750" y="170" class="flow-label">Verification Email</text>

  <!-- P1 to D1 -->
  <path d="M 335 200 L 650 880" class="arrow"/>
  <text x="450" y="500" class="flow-label">New Account</text>

  <!-- P2 to D1 -->
  <path d="M 585 285 L 665 880" class="arrow"/>
  <text x="610" y="550" class="flow-label">Verify Credentials</text>

  <!-- P2 to P3 -->
  <path d="M 515 285 L 335 385" class="arrow"/>
  <text x="400" y="330" class="flow-label">Create Session</text>

  <!-- P3 to D2 -->
  <path d="M 300 490 L 325 550" class="arrow"/>
  <text x="240" y="520" class="flow-label">Store Session</text>

  <!-- P2 to Auth Provider -->
  <path d="M 1010 235 L 1250 760" class="arrow"/>
  <text x="1130" y="460" class="flow-label">SSO Request</text>

  <path d="M 1005 245 L 1250 770" class="arrow"/>
  <text x="1130" y="490" class="flow-label">Token Response</text>

  <!-- P4 to D1 -->
  <path d="M 700 490 L 700 880" class="arrow"/>
  <text x="730" y="680" class="flow-label">Update Profile</text>

  <path d="M 710 880 L 710 490" class="arrow"/>
  <text x="750" y="680" class="flow-label">Read Profile</text>

  <!-- P5 to D1 -->
  <path d="M 930 295 L 750 880" class="arrow"/>
  <text x="870" y="580" class="flow-label">Update Password</text>

  <!-- P5 to Email -->
  <path d="M 1005 210 L 1250 230" class="arrow"/>
  <text x="1120" y="215" class="flow-label">Reset Link</text>

  <!-- P3 to P6 -->
  <path d="M 360 465 L 495 625" class="arrow"/>
  <text x="410" y="545" class="flow-label">Session Token</text>

  <!-- P6 to D1 -->
  <path d="M 590 700 L 650 880" class="arrow"/>
  <text x="600" y="780" class="flow-label">Check Permissions</text>

  <!-- Admin to P7 -->
  <path d="M 150 785 L 240 785" class="arrow"/>
  <text x="180" y="775" class="flow-label">Admin Commands</text>

  <!-- P7 to D1 -->
  <path d="M 360 810 L 600 890" class="arrow"/>
  <text x="460" y="860" class="flow-label">CRUD Operations</text>

  <path d="M 355 800 L 605 885" class="arrow"/>
  <text x="460" y="850" class="flow-label">Query Users</text>

  <!-- P8 to D3 -->
  <path d="M 950 490 L 1075 550" class="arrow"/>
  <text x="1000" y="515" class="flow-label">Write Logs</text>

  <!-- Multiple processes to P8 -->
  <path d="M 355 155 L 895 400" class="arrow"/>
  <text x="580" y="260" class="flow-label" style="font-size: 10px;">Registration Events</text>

  <path d="M 600 270 L 900 395" class="arrow"/>
  <text x="720" y="320" class="flow-label" style="font-size: 10px;">Auth Events</text>

  <path d="M 755 445 L 890 440" class="arrow"/>
  <text x="810" y="435" class="flow-label" style="font-size: 10px;">Profile Changes</text>

  <path d="M 355 775 L 895 460" class="arrow"/>
  <text x="580" y="620" class="flow-label" style="font-size: 10px;">Admin Actions</text>

  <!-- Legend -->
  <g transform="translate(50, 900)">
    <text x="0" y="0" class="text" style="font-weight: bold; text-anchor: start;">Legend:</text>
    <circle cx="15" cy="25" r="12" class="process"/>
    <text x="35" y="30" class="text" style="text-anchor: start;">Process</text>

    <rect x="3" y="45" width="24" height="16" class="external"/>
    <text x="35" y="56" class="text" style="text-anchor: start;">External Entity</text>

    <path d="M 0 70 L 30 70 L 30 85 L 0 85 Z" class="datastore"/>
    <text x="35" y="80" class="text" style="text-anchor: start;">Data Store</text>
  </g>
</svg>
