
<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <style>
      .title { font: bold 24px sans-serif; fill: #2c3e50; }
      .process { fill: #3498db; stroke: #2980b9; stroke-width: 3; }
      .external { fill: #ecf0f1; stroke: #34495e; stroke-width: 2; }
      .datastore { fill: #f39c12; stroke: #e67e22; stroke-width: 2; }
      .text { font: 14px sans-serif; fill: #2c3e50; text-anchor: middle; }
      .label { font: bold 16px sans-serif; fill: white; text-anchor: middle; }
      .flow-label { font: 12px sans-serif; fill: #34495e; }
      .arrow { fill: none; stroke: #2c3e50; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2c3e50" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="40" class="title">Level 0: Account Service - Context Diagram</text>

  <!-- Central System Process -->
  <circle cx="600" cy="400" r="100" class="process"/>
  <text x="600" y="395" class="label">Account</text>
  <text x="600" y="415" class="label">Service</text>

  <!-- External Entities -->
  <!-- User -->
  <rect x="100" y="100" width="120" height="80" class="external"/>
  <text x="160" y="145" class="text">User/Client</text>

  <!-- Admin -->
  <rect x="980" y="100" width="120" height="80" class="external"/>
  <text x="1040" y="145" class="text">Administrator</text>

  <!-- Email System -->
  <rect x="100" y="650" width="120" height="80" class="external"/>
  <text x="160" y="695" class="text">Email System</text>

  <!-- Authentication Provider -->
  <rect x="980" y="650" width="120" height="80" class="external"/>
  <text x="1040" y="685" class="text">Authentication</text>
  <text x="1040" y="705" class="text">Provider</text>

  <!-- Database -->
  <path d="M 550 650 L 650 650 L 650 730 L 550 730 Z M 550 650 Q 600 630 650 650 M 550 660 Q 600 640 650 660" class="datastore"/>
  <text x="600" y="695" class="text">Account</text>
  <text x="600" y="715" class="text">Database</text>

  <!-- Data Flows -->
  <!-- User to System -->
  <path d="M 220 130 L 510 360" class="arrow"/>
  <text x="300" y="220" class="flow-label">Registration Request</text>

  <path d="M 500 340 L 210 150" class="arrow"/>
  <text x="300" y="260" class="flow-label">Account Confirmation</text>

  <path d="M 220 160 L 500 380" class="arrow"/>
  <text x="320" y="290" class="flow-label">Login Credentials</text>

  <path d="M 510 390 L 230 170" class="arrow"/>
  <text x="330" y="310" class="flow-label">Auth Token</text>

  <!-- Admin to System -->
  <path d="M 980 130 L 690 360" class="arrow"/>
  <text x="880" y="220" class="flow-label">User Management</text>

  <path d="M 700 340 L 990 150" class="arrow"/>
  <text x="880" y="260" class="flow-label">Admin Reports</text>

  <!-- System to Email -->
  <path d="M 510 460 L 220 670" class="arrow"/>
  <text x="320" y="570" class="flow-label">Verification Email</text>

  <path d="M 210 680 L 500 470" class="arrow"/>
  <text x="300" y="600" class="flow-label">Delivery Status</text>

  <!-- System to Auth Provider -->
  <path d="M 690 460 L 980 670" class="arrow"/>
  <text x="880" y="550" class="flow-label">SSO Request</text>

  <path d="M 990 680 L 700 470" class="arrow"/>
  <text x="880" y="590" class="flow-label">Auth Response</text>

  <!-- System to Database -->
  <path d="M 600 500 L 600 650" class="arrow"/>
  <text x="650" y="570" class="flow-label">Store/Retrieve</text>
  <text x="650" y="585" class="flow-label">Account Data</text>

  <!-- Legend -->
  <g transform="translate(50, 350)">
    <text x="0" y="0" class="text" style="font-weight: bold; text-anchor: start;">Legend:</text>
    <circle cx="10" cy="25" r="15" class="process"/>
    <text x="35" y="30" class="text" style="text-anchor: start;">Process</text>

    <rect x="-5" y="50" width="30" height="20" class="external"/>
    <text x="35" y="63" class="text" style="text-anchor: start;">External Entity</text>

    <rect x="-5" y="85" width="30" height="20" class="datastore"/>
    <text x="35" y="98" class="text" style="text-anchor: start;">Data Store</text>

    <path d="M 0 120 L 25 120" class="arrow"/>
    <text x="35" y="123" class="text" style="text-anchor: start;">Data Flow</text>
  </g>
</svg>
